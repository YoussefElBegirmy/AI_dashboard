services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aieval
      POSTGRES_PASSWORD: aieval
      POSTGRES_DB: aieval
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aieval -d aieval"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
